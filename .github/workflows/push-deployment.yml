name: Push deployment

# Creates one GitHub deployment per push to a branch, with a URL unique to the run, for testing which pull requests
# show a deployment. Nothing is built; the URL is a placeholder.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Push deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, "");
            const url = `https://example.com/push-preview/run-${context.runId}-${context.sha.slice(0, 7)}`;
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: branch,
              environment: "Push preview",
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              description: `Run ${context.runId}`,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: "success",
              environment_url: url,
              auto_inactive: true,
            });
            core.notice(`Deployment ${deployment.id} of ${branch}: ${url}`);
