name: Test deployment previews

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deployment-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deployment:
    name: Report a synthetic preview deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create deployment and report statuses
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const environment = `preview-pr-${pr.number}`;
            const previewUrl = `https://example.com/linear-test/pr-${pr.number}/${pr.head.sha.slice(0, 7)}`;
            const logUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const { data: deployment } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: pr.head.sha,
              task: "deploy:preview",
              auto_merge: false,
              required_contexts: [],
              environment,
              description: `Synthetic preview for PR #${pr.number}`,
              transient_environment: true,
              production_environment: false,
              payload: {
                synthetic: true,
                pull_request: pr.number,
                head_ref: pr.head.ref,
                workflow_run_id: context.runId,
              },
            });

            core.info(`Created deployment ${deployment.id} for ${pr.head.sha}`);

            for (const [state, description] of [
              ["pending", "Synthetic preview queued"],
              ["in_progress", "Simulating a preview deployment"],
              ["success", "Synthetic preview ready; no application was deployed"],
            ]) {
              const { data: status } = await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state,
                description,
                environment,
                environment_url: previewUrl,
                log_url: logUrl,
                auto_inactive: true,
              });
              core.info(`Reported ${state}: deployment status ${status.id}`);
            }

            await core.summary
              .addHeading("Synthetic deployment")
              .addTable([
                [{ data: "Field", header: true }, { data: "Value", header: true }],
                ["Deployment ID", String(deployment.id)],
                ["Commit", pr.head.sha],
                ["Environment", environment],
                ["Placeholder preview URL", previewUrl],
                ["Logs URL", logUrl],
              ])
              .addRaw("No application was built or deployed. The preview URL is a placeholder.")
              .write();
