name: Native deployment previews

# Experiment: deployments that GitHub creates for a job-level `environment:`, with no API calls.
# Each PR run reports two: one in an environment shared by all PRs, one in an environment named after the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  shared:
    name: Shared environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
      # This URL is known when the job starts.
      url: https://example.com/linear-test/staging/${{ github.event.pull_request.head.sha }}
    steps:
      - name: Simulate a deploy
        run: sleep 45

  per-pr:
    name: Per-PR environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: native-preview-pr-${{ github.event.pull_request.number }}
      # This URL is known only after the deploy step.
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Simulate a deploy
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sleep 45
          echo "url=https://example.com/linear-test/pr-$PR_NUMBER/${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

  # The two jobs below copy the shape of the linear-app client and Storybook jobs: an environment name with a space,
  # a URL from another job's output, and a token that has only the pull-requests permission.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preview_url: ${{ steps.build.outputs.preview_url }}
    steps:
      - name: Simulate a build
        id: build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "preview_url=https://example.com/linear-test/client/pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"

  client-preview:
    name: Client preview deployment
    needs: build
    if: github.event_name == 'pull_request' && needs.build.outputs.preview_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: Client preview
      url: ${{ needs.build.outputs.preview_url }}
    steps:
      - name: Report preview URL
        env:
          PREVIEW_URL: ${{ needs.build.outputs.preview_url }}
        run: echo "Client preview is at $PREVIEW_URL"

  storybook-preview:
    name: Storybook preview deployment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    environment:
      name: Storybook preview
      url: https://example.com/linear-test/storybook/${{ github.event.number }}
    steps:
      - name: Do nothing
        run: "true"
